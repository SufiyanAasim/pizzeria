name: Docker

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pizzeria:ci -f docker/Dockerfile .
